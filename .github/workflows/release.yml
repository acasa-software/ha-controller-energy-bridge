name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that tag, manifest.json and pyproject.toml agree
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/controller_energy_bridge/manifest.json'))['version'])")
          pyproject=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag manifest=$manifest pyproject=$pyproject"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$pyproject" ]; then
            echo "::error::Version mismatch: tag $tag, manifest.json $manifest, pyproject.toml $pyproject"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in
            *-beta*|*-rc*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Extract changelog section
        run: |
          set -euo pipefail
          python3 - "${{ steps.version.outputs.version }}" > release_notes.md <<'PY'
          import re
          import sys

          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S
          )
          if not match:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          print(match.group(1).strip())
          PY
          cat release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
