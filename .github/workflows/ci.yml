name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.harness }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.harness == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        harness: [pinned, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies (pinned)
        if: matrix.harness == 'pinned'
        run: uv pip install --system -r requirements_test.txt
      - name: Install test dependencies (latest harness, early warning)
        if: matrix.harness == 'latest'
        run: |
          uv pip install --system -r requirements_test.txt
          uv pip install --system --upgrade pytest-homeassistant-custom-component
          python -c "import importlib.metadata as m; print('pytest-homeassistant-custom-component', m.version('pytest-homeassistant-custom-component'))"
      - name: pytest
        run: pytest -q
      - name: ruff check
        if: matrix.harness == 'pinned'
        run: ruff check custom_components tests
      - name: ruff format --check
        if: matrix.harness == 'pinned'
        run: ruff format --check custom_components tests
