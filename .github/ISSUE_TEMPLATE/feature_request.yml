name: Feature request
description: Suggest an improvement to the integration.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Changes to the wire format (`docs/protocol.md`) also need a matching change in Controller for HomeKit and are coordinated with the app team.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
