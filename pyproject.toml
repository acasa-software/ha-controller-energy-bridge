[project]
name = "controller-energy-bridge"
version = "1.0.0"
description = "Home Assistant custom integration exposing the Energy dashboard as a HomeKit accessory for Controller for HomeKit"
requires-python = ">=3.14"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]
